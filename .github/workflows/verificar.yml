name: Verificar programas

# Cada programa del curso se compila y se ejecuta en cada cambio. Esta corrida
# es pública: cualquiera puede abrirla y ver el resultado de cada paso.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: programas/revisor/go.mod

      - name: Compilar y ejecutar los programas de las lecciones 2 a 4
        # Los cinco idiomas, no solo el español: el código de los bloques es
        # idéntico en todos, así que si una traducción lo rompe, se ve aquí.
        run: |
          for idi in es en fr pt bg; do
            echo "── idioma: $idi"
            herramientas/verificar-programas.sh "$idi"
          done

      - name: Comparar los extractos de las lecciones 5 a 7 con el código real
        run: |
          for idi in es en fr pt bg; do
            echo "── idioma: $idi"
            herramientas/verificar-extractos.sh "$idi"
          done

      - name: Comprobar que programas/ coincide con las lecciones
        run: herramientas/generar-programas.sh --comprobar

      - name: Pruebas del proyecto real (programas/revisor)
        working-directory: programas/revisor
        run: go test ./...

      - name: Nota sobre la revisión previa a publicar
        run: |
          echo "La revisión de material no publicable (rutas internas, nombres reservados,"
          echo "direcciones de la infraestructura) se corre ANTES de publicar, con la lista"
          echo "de patrones que vive en el repositorio de trabajo y no se publica."
