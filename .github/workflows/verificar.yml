name: Verificar programas

# Cada programa del curso se compila y se ejecuta en cada cambio. Esta corrida
# es pública: cualquiera puede abrirla y ver el resultado de cada paso.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: programas/revisor/go.mod

      - name: Compilar y ejecutar los programas de las lecciones 2 a 4
        run: herramientas/verificar-programas.sh

      - name: Comparar los extractos de las lecciones 5 a 7 con el código real
        run: herramientas/verificar-extractos.sh

      - name: Comprobar que programas/ coincide con las lecciones
        run: herramientas/generar-programas.sh --comprobar

      - name: Pruebas del proyecto real (programas/revisor)
        working-directory: programas/revisor
        run: go test ./...

      - name: Revisar que no haya material que no debe publicarse
        run: ./verificar-publicable.sh
